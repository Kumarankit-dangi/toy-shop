<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product</title>

    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">

            <a href="dashboard.html">
                🧸 Toyland Admin
            </a>

        </div>

    </nav>

</header>


<main>

    <section class="admin-form">


        <div class="section-title">

            <h2 id="form-title">
                Add New Product
            </h2>

            <p>
                Create a new product for your store
            </p>

        </div>


        <form id="product-form">


            <!-- PRODUCT NAME -->

            <input
                type="text"
                id="product-name"
                placeholder="Product Name"
                required
            >


            <!-- PRODUCT PRICE -->

            <input
                type="number"
                id="product-price"
                placeholder="Product Price"
                min="0"
                step="0.01"
                required
            >


            <!-- DISCOUNT -->

            <input
                type="number"
                id="product-discount"
                placeholder="Discount (%)"
                min="0"
                value="0"
            >


            <!-- STOCK -->

            <input
                type="number"
                id="product-stock"
                placeholder="Stock"
                min="0"
                required
            >


            <!-- CATEGORY -->

            <select
                id="product-category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Soft Toys">
                    Soft Toys
                </option>

                <option value="Toy Cars">
                    Toy Cars
                </option>

                <option value="Dolls">
                    Dolls
                </option>

                <option value="Building Toys">
                    Building Toys
                </option>

                <option value="Construction Toys">
                    Construction Toys
                </option>

            </select>


            <!-- IMAGE -->

            <input
                type="text"
                id="product-image"
                placeholder="Image Path (assets/images/...)"
                required
            >


            <!-- DESCRIPTION -->

            <textarea
                id="product-description"
                placeholder="Product Description"
            ></textarea>


            <!-- SAVE BUTTON -->

            <button
                class="btn-primary"
                type="submit"
            >

                Save Product

            </button>


        </form>


    </section>

</main>


<script src="../../assets/js/admin.js"></script>


</body>

</html>
