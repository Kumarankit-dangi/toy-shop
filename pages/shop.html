<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop | Toyland - Premium Toys for Kids</title>

    <meta
        name="description"
        content="Explore Toyland's premium toy collection. Shop teddy bears, toy cars, dolls, building toys and construction toys for kids."
    >

    <meta
        name="keywords"
        content="Toyland shop, kids toys, toy collection, teddy bears, toy cars, dolls, building toys, construction toys"
    >

    <meta
        name="author"
        content="Toyland"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#ff6b6b"
    >


    <!-- Open Graph / Social Sharing -->

    <meta
        property="og:title"
        content="Shop | Toyland - Premium Toys for Kids"
    >

    <meta
        property="og:description"
        content="Explore premium toys for kids at Toyland and discover our latest collection."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Toyland"
    >


    <!-- STYLESHEET -->

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <nav class="navbar">


        <!-- LOGO -->

        <div class="logo">

            <a href="../index.html">
                🧸 Toyland
            </a>

        </div>


        <!-- NAVIGATION -->

        <ul class="nav-links">


            <li>

                <a href="../index.html">
                    Home
                </a>

            </li>


            <li>

                <a href="shop.html">
                    Shop
                </a>

            </li>


            <li>

                <a href="#">
                    Categories
                </a>

            </li>


            <li>

                <a href="about.html">
                    About
                </a>

            </li>


            <li>

                <a href="contact.html">
                    Contact
                </a>

            </li>


        </ul>


        <!-- =================================================
             RIGHT SIDE ICONS
        ================================================= -->

        <div class="nav-icons">


            <!-- SEARCH -->

            <a
                href="shop.html"
                title="Search"
            >
                🔍
            </a>


            <!-- WISHLIST -->

            <a
                href="wishlist.html"
                title="Wishlist"
            >
                ❤️
            </a>


            <!-- CART -->

            <a
                href="cart.html"
                title="Cart"
            >

                🛒

                <span id="cart-count">
                    0
                </span>

            </a>


            <!-- PROFILE -->

            <div id="auth-area">

                <a
                    href="account.html"
                    class="profile-link"
                    title="My Account"
                >
                    A
                </a>

            </div>


        </div>


        <!-- =================================================
             MOBILE LOGIN / PROFILE
        ================================================= -->

        <div
            id="mobile-auth-area"
            class="mobile-auth-area"
        >
        </div>


        <!-- =================================================
             MOBILE MENU
        ================================================= -->

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            type="button"
        >
            ☰
        </button>


    </nav>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         SHOP HEADER
    ================================================= -->

    <section class="shop-header">


        <h1>
            Our Toy Collection
        </h1>


        <p>
            Discover premium toys for kids of all ages.
        </p>


    </section>



    <!-- =================================================
         SEARCH / FILTER / SORT
    ================================================= -->

    <section class="shop-filter">


        <!-- SEARCH -->

        <input
            type="search"
            id="search-box"
            name="toy-search"
            class="search-box"
            placeholder="Search toys..."
            autocomplete="off"
        >



        <!-- CATEGORY -->

        <select
            id="category-filter"
            class="filter-box"
        >


            <option value="all">
                All Categories
            </option>


            <option value="Soft Toys">
                Soft Toys
            </option>


            <option value="Toy Cars">
                Toy Cars
            </option>


            <option value="Dolls">
                Dolls
            </option>


            <option value="Building Toys">
                Building Toys
            </option>


            <option value="Construction Toys">
                Construction Toys
            </option>


        </select>



        <!-- SORT -->

        <select
            id="sort-filter"
            class="filter-box"
        >


            <option value="default">
                Sort By
            </option>


            <option value="low">
                Price Low to High
            </option>


            <option value="high">
                Price High to Low
            </option>


            <option value="newest">
                Newest
            </option>


        </select>


    </section>



    <!-- =================================================
         PRODUCTS
    ================================================= -->

    <section class="shop-products">


        <div
            class="product-container"
            id="product-container"
        ></div>


    </section>


</main>



<!-- =====================================================
     SHOP JAVASCRIPT
===================================================== -->

<script src="../assets/js/shop.js"></script>


</body>

</html>
