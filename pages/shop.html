    >

    <meta

        content="index, follow"
    >

        content="#ff6b6b"
    >


    <!-- Open Graph / Social Sharing -->

    <meta
        property="og:title"
        content="Shop | Toyland - Premium Toys for Kids"
    >

    <meta
        property="og:description"
        content="Explore premium toys for kids at Toyland and discover our latest collection."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Toyland"

    <link
        rel="stylesheet"
        href="../assets/css/style.css"

</head>

    <link rel="stylesheet"
        href="../assets/css/style.css">
</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <a href="../index.html">
                🧸 Toyland
            </a>
        </div>

        <ul class="nav-links">

            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="shop.html">Shop</a>
            </li>

            <li>
                <a href="#">Categories</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

        <div class="nav-icons">

            <a href="shop.html">🔍</a>

            <a href="#">❤️</a>

            <a href="cart.html">🛒</a>

            <a href="login.html">👤 Login</a>

        </div>

    </nav>

</header>


<main>

    <!-- SHOP HEADER -->

    <section class="shop-header">

        <h1>
            Our Toy Collection
        </h1>

        <p>
            Discover premium toys for kids of all ages.
        </p>

    </section>


    <!-- SEARCH / FILTER / SORT -->

    <section class="shop-filter">

        <!-- SEARCH -->

        <input
            type="text"
            id="search-box"
            class="search-box"
            placeholder="Search toys..."
            oninput="applyFilters()"
        >


        <!-- CATEGORY -->

        <select
            id="category-filter"
            class="filter-box"
            onchange="applyFilters()"
        >

            <option value="all">
                All Categories
            </option>

            <option value="Soft Toys">
                Soft Toys
            </option>

            <option value="Toy Cars">
                Toy Cars
            </option>

            <option value="Dolls">
                Dolls
            </option>

            <option value="Building Toys">
                Building Toys
            </option>

            <option value="Construction Toys">
                Construction Toys
            </option>

        </select>


        <!-- SORT -->

        <select
            id="sort-filter"
            class="filter-box"
            onchange="applyFilters()"
        >

            <option value="default">
                Sort By
            </option>

            <option value="low">
                Price Low to High
            </option>

            <option value="high">
                Price High to Low
            </option>

            <option value="newest">
                Newest
            </option>

        </select>

    </section>


    <!-- PRODUCTS -->

    <section class="shop-products">

        <div
            class="product-container"
            id="product-container"
        ></div>

    </section>

</main>


<script src="../assets/js/shop.js"></script>

</body>

</html>
