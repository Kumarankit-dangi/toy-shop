<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Toyland</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body class="login-page">


    <!-- =====================================================
         BACKGROUND TOYLAND WEBSITE
    ====================================================== -->

    <div class="login-background">

        <iframe
            src="../index.html?preview=true"
            title="Toyland Website"
        ></iframe>

    </div>


    <!-- =====================================================
         LOGIN OVERLAY
    ====================================================== -->

    <div class="login-overlay">


        <section class="login">


            <div class="login-box">


                <h2>
                    Welcome Back 👋
                </h2>


                <p>
                    Login to your Toyland account
                </p>


                <form id="login-form">


                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email Address"
                        required
                    >


                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>


                </form>


                <p class="signup-link">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>


            </div>


        </section>


    </div>


    <script src="../assets/js/main.js"></script>

    <script src="../assets/js/login.js"></script>


</body>

</html>
