<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Toyland | Customer Support</title>

    <meta
        name="description"
        content="Contact Toyland for questions, support, orders and toy shopping assistance. Our customer support team is here to help."
    >

    <meta
        name="keywords"
        content="contact Toyland, Toyland customer support, toy store contact, toy shopping help"
    >

    <meta
        name="author"
        content="Toyland"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#ff6b6b"
    >


    <!-- Open Graph / Social Sharing -->

    <meta
        property="og:title"
        content="Contact Toyland | Customer Support"
    >

    <meta
        property="og:description"
        content="Get in touch with Toyland for customer support, orders and toy shopping assistance."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Toyland"
    >


    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>

<body>

<main>

<section class="contact">

    <div class="section-title">
        <h2>Contact Us</h2>
        <p>We'd love to hear from you.</p>
    </div>

    <div class="contact-container">

        <!-- Contact Info -->
        <div class="contact-info">

            <h3>Get In Touch</h3>

            <p>📍 123 Toy Street, New York, USA</p>

            <p>📞 +1 987 654 3210</p>

            <p>📧 support@toyland.com</p>

            <p>🕒 Mon - Sat : 9 AM - 8 PM</p>

        </div>

        <!-- Contact Form -->
        <div class="contact-form">

            <form>

                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <input type="text" placeholder="Subject" required>

                <textarea rows="6" placeholder="Your Message"></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>

<!-- Google Map -->

<section class="map">

<iframe
src="https://www.google.com/maps?q=New+York&output=embed"
allowfullscreen=""
loading="lazy">
</iframe>

</section>

</main>

<script src="../assets/js/main.js"></script>

</body>
</html>
