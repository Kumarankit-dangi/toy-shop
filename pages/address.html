<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Address Book | Toyland</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<header>

<!-- Same Navbar -->

</header>

<main>

<section class="address">

<div class="section-title">

<h2>My Addresses</h2>

<p>Manage your delivery addresses</p>

</div>

<div class="address-form">

<input
type="text"
id="fullname"
placeholder="Full Name"
>

<input
type="text"
id="phone"
placeholder="Phone Number"
>

<textarea
id="address"
placeholder="Full Address"
></textarea>

<input
type="text"
id="city"
placeholder="City"
>

<input
type="text"
id="state"
placeholder="State"
>

<input
type="text"
id="pincode"
placeholder="Pincode"
>

<button id="save-address" class="btn-primary">

Save Address

</button>

</div>

<div id="address-list">

</div>

</section>

</main>

<script src="../assets/js/address.js"></script>

</body>

</html>
