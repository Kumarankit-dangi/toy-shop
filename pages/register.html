<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Toyland</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Create your Toyland account to shop toys, manage orders, cart and wishlist."
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>

<body>

<main>

<section class="register">

    <div class="register-box">

        <h2>Create Account 🚀</h2>

        <p>Join Toyland Today</p>


        <form id="register-form">


            <!-- FULL NAME -->

            <input
                type="text"
                id="register-name"
                placeholder="Full Name"
                required
            >


            <!-- EMAIL + SEND OTP -->

            <div class="input-with-button">

                <input
                    type="email"
                    id="register-email"
                    placeholder="Email Address"
                    required
                >

                <button
                    type="button"
                    id="send-email-otp"
                    class="otp-inline-btn"
                >
                    Send OTP
                </button>

            </div>


            <!-- EMAIL OTP -->

            <div
                id="email-otp-section"
                class="input-with-button"
                style="display: none;"
            >

                <input
                    type="text"
                    id="register-otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                    inputmode="numeric"
                >

                <button
                    type="button"
                    id="verify-email-otp"
                    class="otp-inline-btn"
                >
                    Verify
                </button>

            </div>


            <!-- PHONE -->

            <input
                type="tel"
                id="register-phone"
                placeholder="Phone Number"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="register-password"
                placeholder="Password"
                required
            >


            <!-- CONFIRM PASSWORD -->

            <input
                type="password"
                id="register-confirm-password"
                placeholder="Confirm Password"
                required
            >


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                id="create-account-btn"
            >
                Create Account
            </button>


        </form>


        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</section>

</main>


<script src="../assets/js/main.js"></script>

<script src="../assets/js/register.js"></script>


</body>

</html>
