<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Toyland</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Create your Toyland account to shop toys, manage orders, cart and wishlist."
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>
<body>

<main>

<section class="register">

    <div class="register-box">

        <h2>Create Account 🚀</h2>

        <p>Join Toyland Today</p>

        <form id="register-form">

            <input
                type="text"
                id="register-name"
                placeholder="Full Name"
                required
            >

           <input
    type="text"
    id="register-contact"
    placeholder="Email / Mobile Number"
    autocomplete="email"
    required
>

            <input
                type="password"
                id="register-password"
                placeholder="Password"
                required
            >

            <input
    type="password"
    id="register-confirm-password"
    placeholder="Confirm Password"
    required
>
<div id="otp-section">

    <button
        type="button"
        id="send-otp-btn"
    >
        Send OTP
    </button>

    <input
        type="text"
        id="register-otp"
        placeholder="Enter OTP"
        maxlength="6"
    >

    <button
        type="button"
        id="verify-otp-btn"
    >
        Verify OTP
    </button>

</div>

<!-- OTP TEST -->
<div
    id="otp-section"
    style="
        display: block !important;
        background: yellow;
        padding: 20px;
        margin: 20px 0;
    "
>
    <h3>OTP TEST</h3>

    <button type="button">
        SEND OTP
    </button>

    <input
        type="text"
        placeholder="Enter OTP"
    >

    <button type="button">
        VERIFY OTP
    </button>
</div>

<button type="submit">
    Create Account
</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</section>

</main>


<script src="../assets/js/main.js"></script>

<script src="../assets/js/register.js"></script>


</body>

</html>
