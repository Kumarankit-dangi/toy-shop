<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Toyland</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Create your Toyland account to shop toys, manage orders, cart and wishlist."
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <style>

        /* =====================================================
           PASSWORD FIELD
           ===================================================== */

        .password-wrapper {
            position: relative;
            width: 100%;
            margin: 0;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 55px !important;
            box-sizing: border-box;
        }

        .password-eye {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none !important;
            outline: none !important;

            background: transparent !important;

            padding: 0 !important;
            margin: 0 !important;

            cursor: pointer;

            font-size: 19px;

            z-index: 1000;

            line-height: 1;

            box-shadow: none !important;
        }

        .password-eye:hover {
            background: transparent !important;
            transform: translateY(-50%) scale(1.08);
        }

    </style>

</head>


<body>

<main>

<section class="register">

    <div class="register-box">

        <h2>Create Account 🚀</h2>

        <p>Join Toyland Today</p>


        <form id="register-form">


            <!-- =================================================
                 FULL NAME
                 ================================================= -->

            <input
                type="text"
                id="register-name"
                placeholder="Full Name"
                required
            >


            <!-- =================================================
                 EMAIL
                 ================================================= -->

            <input
                type="email"
                id="register-email"
                placeholder="Email Address"
                required
            >


            <!-- =================================================
                 PHONE
                 ================================================= -->

            <input
                type="tel"
                id="register-phone"
                placeholder="Phone Number"
                required
            >


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="password-wrapper">

                <input
                    type="password"
                    id="register-password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-eye"
                    onclick="togglePassword('register-password', this)"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>


            <!-- =================================================
                 CONFIRM PASSWORD
                 ================================================= -->

            <div class="password-wrapper">

                <input
                    type="password"
                    id="register-confirm-password"
                    placeholder="Confirm Password"
                    required
                >

                <button
                    type="button"
                    class="password-eye"
                    onclick="togglePassword('register-confirm-password', this)"
                    aria-label="Show password"
                >
                    👁️
                </button>

            </div>


            <!-- =================================================
                 CREATE ACCOUNT
                 ================================================= -->

            <button
                type="submit"
                id="create-account-btn"
            >
                Create Account
            </button>


        </form>


        <!-- =====================================================
             LOGIN LINK
             ===================================================== -->

        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</section>

</main>


<!-- =========================================================
     MAIN JAVASCRIPT
     ========================================================= -->

<script src="../assets/js/main.js"></script>


<!-- =========================================================
     REGISTER JAVASCRIPT
     ========================================================= -->

<script src="../assets/js/register.js"></script>


<!-- =========================================================
     PASSWORD SHOW / HIDE
     ========================================================= -->

<script>

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (!input) {
        return;
    }


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}

</script>


</body>

</html>
