<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Toyland</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">

</head>

<body>

<header>

    <!-- Same Navbar -->

</header>

<main>

<section class="profile">

    <div class="profile-card">

        <div class="profile-image">

            <img src="../assets/images/user.png" alt="User">

        </div>

        <h2 id="profile-name">Ankit Kumar</h2>

        <p id="profile-email">
            ankit@gmail.com
        </p>

        <div class="profile-info">

            <div class="info-box">

                <label>Phone</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter Phone Number"
                >

            </div>

            <div class="info-box">

                <label>Address</label>

                <textarea
                    id="address"
                    placeholder="Enter Address"
                ></textarea>

            </div>

        </div>

        <button
            id="save-profile"
            class="btn-primary"
        >
            Save Profile
        </button>

    </div>

</section>

</main>

<script src="../assets/js/auth.js"></script>

</body>

</html>
