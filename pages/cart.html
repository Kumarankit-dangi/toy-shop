<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping Cart | Toyland</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="View and manage your selected Toyland products before checkout."
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>
<body>


<header>
    <nav class="navbar">

        <!-- LOGO -->
        <div class="logo">
            <a href="../index.html">
                🧸 Toyland
            </a>
        </div>


        <!-- MOBILE / DESKTOP NAV LINKS -->
        <ul class="nav-links">

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="shop.html">
                    Shop
                </a>
            </li>

            <li>
                <a href="../index.html#categories">
                    Categories
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>


        <!-- RIGHT SIDE -->
        <div class="nav-icons">

            <!-- SEARCH -->
            <div class="search-box">

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search toys..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="search-button"
                    title="Search"
                >
                    🔍
                </button>

            </div>


            <!-- WISHLIST -->
            <a
                href="wishlist.html"
                class="wishlist-link"
                title="Wishlist"
            >
                ❤️
                <span id="wishlist-count">0</span>
            </a>


            <!-- CART -->
            <a
                href="cart.html"
                class="cart-icon"
                title="Cart"
            >
                🛒
                <span id="cart-count">0</span>
            </a>


            <!-- MY ORDERS -->
            <a
                href="my-orders.html"
                class="my-orders-link"
            >
                📦 My Orders
            </a>


            <!-- PROFILE -->
            <div id="auth-area">

                <a
                    href="account.html"
                    class="profile-link"
                    title="My Account"
                >
                    A
                </a>

            </div>

        </div>


        <!-- MOBILE LOGIN / PROFILE -->
        <div
            id="mobile-auth-area"
            class="mobile-auth-area"
        >
        </div>


        <!-- MOBILE MENU BUTTON -->
        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open menu"
            type="button"
        >
            ☰
        </button>

    </nav>
</header>

<main>

    <section class="cart-page">

        <div class="section-title">
            <h2>Shopping Cart 🛒</h2>
            <p>Your selected products</p>
        </div>


        <div id="cart-items">
            <!-- Products will come from localStorage -->
        </div>


        <div class="cart-summary">

            <h3>
                Total: ₹<span id="cart-total">0.00</span>
            </h3>

            <button
                class="checkout-btn"
                id="checkout-btn">
                Proceed to Checkout
            </button>

        </div>

    </section>

</main>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/main.js"></script>

</body>

</html>
